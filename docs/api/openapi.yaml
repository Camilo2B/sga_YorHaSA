openapi: 3.1.0
info:
  title: SGA - Búnker Orbital YoRHa API
  description: >-
    API OpenAPI 3.1 para el Sistema de Gestión de Alojamiento (SGA) del Búnker Orbital YoRHa.
    Convención de errores: 400 = la forma del mensaje es inválida (la detectan las validaciones del DTO);
    404 = el recurso no existe; 409 = el mensaje es válido pero viola una regla de negocio (la detecta el dominio).
    Todos los errores usan el mismo formato ErrorResponse y nunca incluyen trazas técnicas.
    Listados: todos se paginan de 10 en 10 (parámetros page, empezando en 0, y size) y responden con el mismo formato
    de página (content + page).
  version: 1.0.0

security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      summary: Iniciar sesión y obtener un token JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales correctas. Devuelve el token JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Correo o contraseña con formato inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas:
    post:
      summary: Crear una nueva reserva (CrearReservaUseCase)
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
      responses:
        '201':
          description: Reserva creada exitosamente en estado PENDIENTE.
          headers:
            Location:
              description: URI de la reserva creada.
              schema:
                type: string
                example: /api/reservas/RES-2026-00001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '400':
          description: La forma del mensaje es inválida (campos faltantes, JSON malformado o valores no permitidos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento indicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Regla de negocio violada: entrada anterior a hoy (RN-04), salida no posterior a la entrada (RN-03), titular menor
            del umbral, ocupante repetido, capacidad superada (RN-02, la mascota ocupa un cupo: RN-Propia-03), mascota en un
            apartamento que no la permite (RN-Propia-03), apartamento no disponible por reserva solapada o bloqueo (RN-01,
            RN-07) o sin tiempo de preparación con otra reserva (RN-20), o sin tarifa para alguna noche.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar reservas con filtros, de la más reciente a la más antigua (ConsultarReservasUseCase)
      description: >-
        7.5: todos los filtros son opcionales. Con desde y hasta se traen las reservas que tienen al menos una noche en
        [desde, hasta). El orden es por fecha de creación, de la más reciente a la más antigua.
      operationId: consultarReservas
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [PENDIENTE, CONFIRMADA, EN_CURSO, FINALIZADA, CANCELADA, NO_SHOW]
        - name: identificacionApartamento
          in: query
          required: false
          schema:
            type: string
            example: CTL-001
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-12-01"
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-12-31"
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de reservas encontradas (10 por página).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumen'
        '400':
          description: Un filtro tiene un formato inválido (estado inexistente, fecha mal escrita) o hasta no es posterior a desde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}:
    get:
      summary: Consultar detalle de una reserva por su código
      operationId: obtenerReservaPorCodigo
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: RES-2026-00001
      responses:
        '200':
          description: Detalle de la reserva consultada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '404':
          description: Reserva no encontrada (también si el código no tiene el formato RES-AAAA-NNNNN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/confirmar:
    put:
      summary: Confirmar una reserva pendiente cobrando el anticipo (ConfirmarReservaUseCase)
      description: >-
        PENDIENTE -> CONFIRMADA (RN-08). Exige la hora estimada de llegada (RN-09), que todavía esté dentro del plazo de
        confirmación (RN-21) y cobra el anticipo configurado (50% del valor de la estancia en la Ficha). El cuerpo es opcional.
      operationId: confirmarReserva
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: RES-2026-00001
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarReservaRequest'
      responses:
        '200':
          description: Reserva confirmada, con el anticipo registrado en su folio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '400':
          description: La forma del mensaje es inválida (medio de pago inexistente, hora con formato incorrecto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reserva no encontrada (también si el código no tiene el formato RES-AAAA-NNNNN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Regla de negocio violada: no está PENDIENTE (RN-08), falta la hora estimada de llegada (RN-09), el plazo de confirmación venció (RN-21), falta el medio de pago del anticipo o la hora ya estaba registrada."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/cancelar:
    put:
      summary: Cancelar una reserva aplicando la política de retención (CancelarReservaUseCase)
      description: >-
        Solo desde PENDIENTE o CONFIRMADA (RN-08). La retención se calcula sobre el anticipo pagado, con la versión de la
        política congelada en la reserva (RN-13) y la antelación hasta el inicio del día de entrada. Libera las noches (RN-12).
      operationId: cancelarReserva
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: RES-2026-00001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarReservaRequest'
      responses:
        '200':
          description: Reserva cancelada, con el motivo y el reparto del anticipo entre retenido y devuelto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '400':
          description: El motivo falta o no tiene entre 5 y 300 caracteres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reserva no encontrada (también si el código no tiene el formato RES-AAAA-NNNNN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "No se puede cancelar: la reserva está EN_CURSO, FINALIZADA, CANCELADA o NO_SHOW (RN-08)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/registrar-llegada:
    put:
      summary: Registrar la llegada del grupo, check-in (RegistrarLlegadaUseCase)
      description: >-
        La reserva pasa a EN_CURSO y el apartamento a OCUPADO. Solo sobre una reserva CONFIRMADA, desde la fecha de
        entrada (RN-10) y con el apartamento PREPARADO (RN-11).
      operationId: registrarLlegada
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: RES-2026-00001
      responses:
        '200':
          description: Llegada registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '404':
          description: Reserva no encontrada (también si el código no tiene el formato RES-AAAA-NNNNN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "No procede el registro: la reserva no está CONFIRMADA o no es la fecha de entrada (RN-10), o el apartamento no está PREPARADO (RN-11)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/registrar-salida:
    put:
      summary: Registrar la salida del grupo, check-out (RegistrarSalidaUseCase)
      description: >-
        La reserva pasa a FINALIZADA y el apartamento a PENDIENTE_PREPARACION. Solo con el folio en paz y salvo (RN-17).
      operationId: registrarSalida
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: RES-2026-00001
      responses:
        '200':
          description: Salida registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '404':
          description: Reserva no encontrada (también si el código no tiene el formato RES-AAAA-NNNNN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La reserva no está EN_CURSO o el folio tiene saldo pendiente (RN-17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/no-show:
    put:
      summary: Declarar el no-show de una reserva (DeclararNoShowUseCase)
      description: >-
        Solo una reserva CONFIRMADA y pasada la hora límite del día de entrada (RN-12). Libera las noches y retiene el
        anticipo según la política congelada en la reserva (RN-13). También se declara solo, de forma automática.
      operationId: declararNoShow
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: RES-2026-00001
      responses:
        '200':
          description: Reserva en NO_SHOW, con el reparto del anticipo entre retenido y devuelto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '404':
          description: Reserva no encontrada (también si el código no tiene el formato RES-AAAA-NNNNN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La reserva no está CONFIRMADA o todavía no pasó la hora límite de no-show.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/folio:
    get:
      summary: Consultar el folio de una reserva (ConsultarFolioUseCase)
      description: Cargos, pagos y saldo pendiente (RN-15). El saldo es la diferencia entre cargos y pagos.
      operationId: consultarFolio
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: RES-2026-00001
      responses:
        '200':
          description: Folio de la reserva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '404':
          description: Reserva no encontrada (también si el código no tiene el formato RES-AAAA-NNNNN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/folio/pagos:
    post:
      summary: Registrar un pago en el folio (RegistrarPagoUseCase)
      description: >-
        Crea un movimiento en el folio (RN-15). Solo en reservas CONFIRMADA o EN_CURSO, y nunca por más que el saldo
        pendiente. Los movimientos no se modifican ni se eliminan (RN-16), por eso no hay PUT ni DELETE.
      operationId: registrarPago
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: RES-2026-00001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarPagoRequest'
      responses:
        '201':
          description: Pago registrado; responde con el folio actualizado.
          headers:
            Location:
              description: URI del folio de la reserva.
              schema:
                type: string
                example: /api/reservas/RES-2026-00001/folio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '400':
          description: La forma del mensaje es inválida (medio de pago inexistente, valor faltante o menor o igual a cero).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reserva no encontrada (también si el código no tiene el formato RES-AAAA-NNNNN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La reserva no admite pagos (no está CONFIRMADA ni EN_CURSO) o el pago supera el saldo pendiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}/iniciar-preparacion:
    put:
      summary: El personal de servicio empieza a preparar el apartamento (IniciarPreparacionApartamentoUseCase)
      description: PENDIENTE_PREPARACION a EN_PREPARACION (7.6).
      operationId: iniciarPreparacionApartamento
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
      responses:
        '200':
          description: Apartamento en preparación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '404':
          description: No existe el apartamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El apartamento no está PENDIENTE_PREPARACION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}/marcar-preparado:
    put:
      summary: Dejar el apartamento listo para el siguiente grupo (MarcarApartamentoPreparadoUseCase)
      description: EN_PREPARACION a PREPARADO (7.6).
      operationId: marcarApartamentoPreparado
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
      responses:
        '200':
          description: Apartamento preparado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '404':
          description: No existe el apartamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El apartamento no está EN_PREPARACION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos:
    post:
      summary: Registrar un apartamento (CrearApartamentoUseCase)
      operationId: crearApartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearApartamentoRequest'
      responses:
        '201':
          description: Apartamento registrado.
          headers:
            Location:
              description: URI del apartamento creado.
              schema:
                type: string
                example: /api/apartamentos/ATK-001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          description: La forma del mensaje es inválida (campos faltantes, capacidad menor a 1, estado operativo inexistente, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (identificación de apartamento repetida, L-04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar el inventario de apartamentos (ListarApartamentosUseCase)
      description: Activos y retirados de la venta, ordenados por identificación.
      operationId: listarApartamentos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de apartamentos (10 por página).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaApartamento'

  /api/apartamentos/disponibles:
    get:
      summary: Buscar apartamentos disponibles por fechas y composición del grupo (BuscarApartamentosDisponiblesUseCase)
      description: >-
        7.5: un apartamento está disponible si está activo, admite al grupo (RN-02: adultos y niños cuentan para la
        capacidad; RN-Propia-03: con mascota debe permitir mascotas y la mascota ocupa un cupo), no tiene bloqueos
        (RN-07) ni reservas activas (RN-01) en esas noches y respeta el tiempo de preparación con la reserva anterior
        y la siguiente (RN-20). Ordenados por identificación.
      operationId: buscarApartamentosDisponibles
      parameters:
        - name: fechaEntrada
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-12-01"
        - name: fechaSalida
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-12-03"
        - name: adultos
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            example: 2
        - name: ninos
          in: query
          required: false
          description: Si no se envía se asume 0.
          schema:
            type: integer
            minimum: 0
            example: 1
        - name: conMascota
          in: query
          required: false
          description: Si no se envía se asume false.
          schema:
            type: boolean
            example: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de apartamentos disponibles (10 por página).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaApartamento'
        '400':
          description: Falta un parámetro obligatorio o tiene un formato inválido (fecha mal escrita, adultos menor a 1, niños negativos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (RN-03, la fecha de salida no es posterior a la de entrada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}/capacidad:
    put:
      summary: Cambiar la capacidad de un apartamento (CambiarCapacidadApartamentoUseCase)
      description: 7.3. La capacidad sigue siendo un tope rígido (RN-02) y no puede bajar de los cupos que ocupa una reserva activa.
      operationId: cambiarCapacidadApartamento
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: SNR-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarCapacidadRequest'
      responses:
        '200':
          description: Capacidad cambiada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          description: La forma del mensaje es inválida (capacidad faltante o menor a 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (una reserva activa ocupa más cupos que la nueva capacidad, o el apartamento está retirado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}/retirar:
    put:
      summary: Retirar un apartamento de la venta (RetirarApartamentoUseCase)
      description: >-
        7.3 / 12.4: eliminación lógica. El apartamento queda con activo=false, deja de aparecer como disponible y las
        reservas históricas lo siguen referenciando. Solo se permite si no tiene reservas activas ni futuras.
      operationId: retirarApartamento
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: OPR-001
      responses:
        '200':
          description: Apartamento retirado de la venta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '404':
          description: No existe el apartamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (tiene reservas activas o futuras, o ya estaba retirado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}:
    get:
      summary: Consultar un apartamento por su identificación (ConsultarApartamentoUseCase)
      operationId: consultarApartamento
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
      responses:
        '200':
          description: Apartamento encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '404':
          description: No existe un apartamento con esa identificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alojamiento:
    get:
      summary: Consultar el alojamiento con sus parámetros, temporadas y política de cancelación vigente (ConsultarAlojamientoUseCase)
      operationId: consultarAlojamiento
      responses:
        '200':
          description: Datos del alojamiento. Los parámetros salen de la configuración del sistema (application.properties).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientoResponse'
        '404':
          description: El alojamiento todavía no ha sido configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alojamiento/temporadas:
    post:
      summary: Registrar una temporada (RegistrarTemporadaUseCase)
      operationId: registrarTemporada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarTemporadaRequest'
      responses:
        '201':
          description: Temporada registrada.
          headers:
            Location:
              description: URI de la temporada creada.
              schema:
                type: string
                example: /api/alojamiento/temporadas/3f2b8c1e-5a47-4d9e-9c1a-7b6d2e8f0a11
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
        '400':
          description: La forma del mensaje es inválida (nombre vacío, fechas faltantes o con formato incorrecto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El alojamiento todavía no ha sido configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (la fecha de fin no es posterior a la de inicio, o la temporada se solapa con otra existente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alojamiento/temporadas/{id}:
    get:
      summary: Consultar una temporada por su identificador (ConsultarTemporadaUseCase)
      operationId: consultarTemporada
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Temporada encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
        '400':
          description: El identificador no tiene formato UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe una temporada con ese identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{id}/bloquear:
    post:
      summary: Bloquear un apartamento para mantenimiento o uso administrativo (BloquearApartamentoUseCase)
      operationId: bloquearApartamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloquearApartamentoRequest'
      responses:
        '201':
          description: Bloqueo registrado. Las noches [fechaInicio, fechaFin) dejan de venderse (RN-07).
          headers:
            Location:
              description: URI del bloqueo creado.
              schema:
                type: string
                example: /api/apartamentos/ATK-001/bloqueos/9b1d2c3e-4f50-4a61-8b72-9c83d4e5f601
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueoResponse'
        '400':
          description: La forma del mensaje es inválida (fechas faltantes o motivo vacío).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento indicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto con reservas activas en el rango seleccionado (RN-07), con otro bloqueo existente o fechas invertidas (RN-03).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}/bloqueos:
    get:
      summary: Listar los bloqueos de un apartamento (ListarBloqueosApartamentoUseCase)
      description: Ordenados por fecha de inicio.
      operationId: listarBloqueosApartamento
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: GNR-001
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de bloqueos (10 por página).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaBloqueo'
        '404':
          description: No existe el apartamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}/bloqueos/{id}:
    get:
      summary: Consultar un bloqueo de un apartamento (ConsultarBloqueoUseCase)
      operationId: consultarBloqueo
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bloqueo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueoResponse'
        '400':
          description: El identificador no tiene formato UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento o el bloqueo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}/tarifas:
    post:
      summary: Definir la tarifa de un apartamento para una temporada (DefinirTarifaUseCase)
      description: >-
        Agrega una nueva versión de la tarifa; las anteriores se conservan como histórico (7.4).
        La tarifa nueva debe regir después de la más reciente de esa misma temporada.
      operationId: definirTarifa
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinirTarifaRequest'
      responses:
        '201':
          description: Tarifa definida.
          headers:
            Location:
              description: URI de la tarifa creada.
              schema:
                type: string
                example: /api/apartamentos/ATK-001/tarifas/5c6d7e8f-9a01-4b23-8c45-6d7e8f9a0b12
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarifaResponse'
        '400':
          description: La forma del mensaje es inválida (temporada, valor o fecha faltantes, valor menor o igual a cero, identificador que no es UUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento o la temporada indicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (la tarifa no rige después de la más reciente de esa temporada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Consultar el histórico de tarifas de un apartamento (ListarTarifasApartamentoUseCase)
      description: Devuelve las tarifas de la más reciente a la más antigua. Con temporadaId se limita a esa temporada.
      operationId: listarTarifasApartamento
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
        - name: temporadaId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página del histórico de tarifas (10 por página).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTarifa'
        '400':
          description: El temporadaId no tiene formato UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}/tarifas/{id}:
    get:
      summary: Consultar una tarifa del histórico de un apartamento (ConsultarTarifaUseCase)
      operationId: consultarTarifa
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tarifa encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarifaResponse'
        '400':
          description: El identificador no tiene formato UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento o la tarifa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alojamiento/politica-cancelacion:
    post:
      summary: Definir una nueva versión de la política de cancelación (DefinirPoliticaCancelacionUseCase)
      description: >-
        Agrega una versión nueva; las anteriores se conservan (F-07, RN-13). Mínimo dos tramos, uno de ellos de 0 horas,
        sin repetir la antelación mínima, y debe regir después de la versión más reciente.
      operationId: definirPoliticaCancelacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinirPoliticaCancelacionRequest'
      responses:
        '201':
          description: Política definida.
          headers:
            Location:
              description: URI de la versión creada.
              schema:
                type: string
                example: /api/alojamiento/politica-cancelacion/2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
        '400':
          description: La forma del mensaje es inválida (sin tramos, retención fuera de 0 a 1, antelación negativa, fecha faltante).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El alojamiento todavía no ha sido configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (menos de dos tramos, sin tramo de 0 horas, antelaciones repetidas o vigencia no posterior a la versión más reciente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Consultar todas las versiones de la política de cancelación (ListarPoliticasCancelacionUseCase)
      description: De la primera versión a la más reciente.
      operationId: listarPoliticasCancelacion
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página del historial de versiones (10 por página).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPoliticaCancelacion'
        '404':
          description: El alojamiento todavía no ha sido configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alojamiento/politica-cancelacion/{version}:
    get:
      summary: Consultar una versión de la política de cancelación (ConsultarPoliticaCancelacionUseCase)
      operationId: consultarPoliticaCancelacion
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Versión encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
        '400':
          description: La versión no es un número entero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe esa versión de la política.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cotizaciones:
    post:
      summary: Cotizar una estancia (CotizarEstanciaUseCase)
      description: >-
        Calcula el valor de una estancia noche por noche (RN-05) con la tarifa de la temporada de cada noche, solo los
        ocupantes facturables a la fecha de entrada (RN-06) y el descuento por estancia prolongada (RN-Propia-01).
        No crea nada: es una consulta, por eso responde 200.
      operationId: cotizarEstancia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizarEstanciaRequest'
      responses:
        '200':
          description: Cotización con su desglose por noche.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResponse'
        '400':
          description: La forma del mensaje es inválida (apartamento, fechas u ocupantes faltantes, fecha de nacimiento futura).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento indicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (salida no posterior a la entrada, ningún ocupante facturable, o el apartamento no tiene tarifa para la temporada de alguna noche).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Número de página, empezando en 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Elementos por página.
      schema:
        type: integer
        minimum: 1
        default: 10

  schemas:
    PaginaInfo:
      type: object
      description: Datos de la página que acompañan a cada listado.
      properties:
        size:
          type: integer
          example: 10
        number:
          type: integer
          description: Página actual, empezando en 0.
          example: 0
        totalElements:
          type: integer
          example: 15
        totalPages:
          type: integer
          example: 2

    PaginaApartamento:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ApartamentoResponse'
        page:
          $ref: '#/components/schemas/PaginaInfo'

    PaginaReservaResumen:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReservaResumenResponse'
        page:
          $ref: '#/components/schemas/PaginaInfo'

    PaginaTarifa:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TarifaResponse'
        page:
          $ref: '#/components/schemas/PaginaInfo'

    PaginaBloqueo:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BloqueoResponse'
        page:
          $ref: '#/components/schemas/PaginaInfo'

    PaginaPoliticaCancelacion:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PoliticaCancelacionResponse'
        page:
          $ref: '#/components/schemas/PaginaInfo'

    CrearReservaRequest:
      type: object
      required:
        - identificacionApartamento
        - fechaEntrada
        - fechaSalida
        - canalOrigen
        - titular
        - ocupantes
      properties:
        identificacionApartamento:
          type: string
          example: ATK-001
        fechaEntrada:
          type: string
          format: date
          example: "2026-12-13"
        fechaSalida:
          type: string
          format: date
          description: Exclusiva; la noche de la salida no se cobra.
          example: "2026-12-18"
        canalOrigen:
          type: string
          enum: [PORTAL, DIRECTO, EXTERNO]
        horaEstimadaLlegada:
          type: string
          example: "15:30"
          description: Opcional al crear (obligatoria antes de confirmar, RN-09). Entre las 22:00 y las 05:00 genera el recargo de RN-Propia-02.
        conMascota:
          type: boolean
          default: false
          description: Con mascota se ocupa un cupo del apartamento (RN-Propia-03).
        titular:
          $ref: '#/components/schemas/OcupanteRequest'
        ocupantes:
          type: array
          description: Acompañantes del titular (el titular ya cuenta como ocupante). Puede ir vacía.
          items:
            $ref: '#/components/schemas/OcupanteRequest'

    BloquearApartamentoRequest:
      type: object
      required:
        - fechaInicio
        - fechaFin
        - motivo
      properties:
        fechaInicio:
          type: string
          format: date
          example: "2026-11-01"
        fechaFin:
          type: string
          format: date
          example: "2026-11-05"
        motivo:
          type: string
          example: "Mantenimiento preventivo de sistemas orbitales"

    BloqueoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        identificacionApartamento:
          type: string
          example: ATK-001
        fechaInicio:
          type: string
          format: date
          example: "2026-11-01"
        fechaFin:
          type: string
          format: date
          description: Primera noche que vuelve a venderse (el rango es [fechaInicio, fechaFin)).
          example: "2026-11-05"
        motivo:
          type: string
          example: "Mantenimiento preventivo de sistemas orbitales"

    CambiarCapacidadRequest:
      type: object
      required:
        - capacidad
      properties:
        capacidad:
          type: integer
          minimum: 1
          example: 5

    ReservaResumenResponse:
      type: object
      properties:
        codigo:
          type: string
          example: RES-2026-00001
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADA, EN_CURSO, FINALIZADA, CANCELADA, NO_SHOW]
        identificacionApartamento:
          type: string
          example: ATK-001
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        nombreTitular:
          type: string
          example: Carlos Pérez
        totalOcupantes:
          type: integer
          example: 2
        valorTotal:
          type: integer
          description: Valor congelado de la estancia en COP (RN-22).
          example: 500000

    CrearApartamentoRequest:
      type: object
      required:
        - identificacion
        - nombre
        - capacidad
        - dormitorios
        - estadoOperativoInicial
      properties:
        identificacion:
          type: string
          example: ATK-001
        nombre:
          type: string
          example: Attack Suite
        capacidad:
          type: integer
          minimum: 1
          example: 4
        dormitorios:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DormitorioRequest'
        estadoOperativoInicial:
          type: string
          enum: [PREPARADO, OCUPADO, PENDIENTE_PREPARACION, EN_PREPARACION, FUERA_DE_SERVICIO]
        permiteMascotas:
          type: boolean
          description: RN-Propia-03. Si no se envía se asume false (el apartamento no recibe reservas con mascota).
          example: true

    DormitorioRequest:
      type: object
      required:
        - descripcion
        - tipoCama
      properties:
        descripcion:
          type: string
          example: Dormitorio 1
        tipoCama:
          type: string
          example: Cama doble

    ApartamentoResponse:
      type: object
      properties:
        identificacion:
          type: string
          example: ATK-001
        nombre:
          type: string
          example: Attack Suite
        capacidad:
          type: integer
          example: 4
        dormitorios:
          type: array
          items:
            $ref: '#/components/schemas/DormitorioResponse'
        permiteMascotas:
          type: boolean
          example: true
        estadoOperativo:
          type: string
          enum: [PREPARADO, OCUPADO, PENDIENTE_PREPARACION, EN_PREPARACION, FUERA_DE_SERVICIO]
        activo:
          type: boolean
          description: false si el apartamento fue retirado de la venta (eliminación lógica, 12.4).
          example: true

    DormitorioResponse:
      type: object
      properties:
        descripcion:
          type: string
          example: Dormitorio 1
        tipoCama:
          type: string
          example: Cama doble

    RegistrarTemporadaRequest:
      type: object
      required:
        - nombre
        - fechaInicio
        - fechaFin
      properties:
        nombre:
          type: string
          example: Alta (mitad de año)
        fechaInicio:
          type: string
          format: date
          example: "2027-06-01"
        fechaFin:
          type: string
          format: date
          description: Exclusiva, igual que en las estancias [inicio, fin).
          example: "2027-08-01"

    TemporadaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Despliegue de Misión
        fechaInicio:
          type: [string, 'null']
          format: date
          description: Nula en la temporada base, que cubre toda fecha no cubierta por otra temporada.
        fechaFin:
          type: [string, 'null']
          format: date
        esBase:
          type: boolean
          example: false

    ParametrosResponse:
      type: object
      description: Parámetros de la Ficha (sección 6). Salen de application.properties, no de la base de datos.
      properties:
        umbralEdadFacturable:
          type: integer
          example: 12
        horaEntrada:
          type: string
          format: time
          example: "15:00:00"
        horaSalida:
          type: string
          format: time
          example: "11:00:00"
        tiempoPreparacionHoras:
          type: integer
          example: 3
        plazoConfirmacionHoras:
          type: integer
          example: 24
        horaLimiteNoShow:
          type: string
          format: time
          example: "21:00:00"
        exigeAnticipo:
          type: boolean
          example: true
        porcentajeAnticipo:
          type: number
          description: Fracción del valor de la estancia (0.50 = 50%).
          example: 0.50

    TramoResponse:
      type: object
      properties:
        antelacionMinimaHoras:
          type: integer
          example: 168
        porcentajeRetencion:
          type: number
          example: 0.00
        porcentajeDevolucion:
          type: number
          description: Siempre es el complemento de la retención.
          example: 1.00

    PoliticaCancelacionResponse:
      type: object
      properties:
        version:
          type: integer
          example: 1
        vigenteDesde:
          type: string
          format: date
        tramos:
          type: array
          items:
            $ref: '#/components/schemas/TramoResponse'

    AlojamientoResponse:
      type: object
      properties:
        nombre:
          type: string
          example: Búnker Orbital YoRHa - Suites & Apartamentos Temáticos
        ciudad:
          type: string
          example: El Espacio
        parametros:
          $ref: '#/components/schemas/ParametrosResponse'
        temporadas:
          type: array
          items:
            $ref: '#/components/schemas/TemporadaResponse'
        politicaVigente:
          $ref: '#/components/schemas/PoliticaCancelacionResponse'

    DefinirTarifaRequest:
      type: object
      required:
        - temporadaId
        - valorPorNoche
        - vigenteDesde
      properties:
        temporadaId:
          type: string
          format: uuid
        valorPorNoche:
          type: number
          description: Valor por ocupante facturable y por noche, en COP. Mayor a cero.
          example: 90000
        vigenteDesde:
          type: string
          format: date
          example: "2027-01-01"

    TarifaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        temporadaId:
          type: string
          format: uuid
        valorPorNoche:
          type: number
          example: 80000
        vigenteDesde:
          type: string
          format: date

    TramoRequest:
      type: object
      required:
        - antelacionMinimaHoras
        - porcentajeRetencion
      properties:
        antelacionMinimaHoras:
          type: integer
          minimum: 0
          example: 168
        porcentajeRetencion:
          type: number
          minimum: 0
          maximum: 1
          description: Fracción del anticipo que se retiene (0.50 = 50%). La devolución es el complemento.
          example: 0.00

    DefinirPoliticaCancelacionRequest:
      type: object
      required:
        - tramos
        - vigenteDesde
      properties:
        tramos:
          type: array
          items:
            $ref: '#/components/schemas/TramoRequest'
        vigenteDesde:
          type: string
          format: date
          example: "2027-01-01"

    OcupanteRequest:
      type: object
      required:
        - documento
        - nombre
        - fechaNacimiento
      properties:
        documento:
          type: string
          minLength: 7
          maxLength: 11
          example: "1094123456"
        nombre:
          type: string
          example: Camilo Ruiz
        fechaNacimiento:
          type: string
          format: date
          description: La edad se calcula a la fecha de entrada; nunca se envía.
          example: "1990-05-01"

    CotizarEstanciaRequest:
      type: object
      required:
        - identificacionApartamento
        - fechaEntrada
        - fechaSalida
        - ocupantes
      properties:
        identificacionApartamento:
          type: string
          example: ATK-001
        fechaEntrada:
          type: string
          format: date
          example: "2026-12-13"
        fechaSalida:
          type: string
          format: date
          description: Exclusiva; la noche de la salida no se cobra.
          example: "2026-12-18"
        ocupantes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OcupanteRequest'

    DetalleNocheResponse:
      type: object
      description: Valores en pesos colombianos sin decimales.
      properties:
        fecha:
          type: string
          format: date
        temporada:
          type: string
          example: Media (Sincronización)
        tarifaAplicada:
          type: integer
          format: int64
          description: Tarifa de la noche por ocupante facturable, ya con el descuento si aplica.
          example: 90000
        ocupantesFacturables:
          type: integer
          example: 2
        subtotal:
          type: integer
          format: int64
          example: 180000

    CotizacionResponse:
      type: object
      properties:
        identificacionApartamento:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        noches:
          type: integer
        ocupantesFacturables:
          type: integer
        desglose:
          type: array
          items:
            $ref: '#/components/schemas/DetalleNocheResponse'
        valorTotal:
          type: integer
          format: int64
          example: 1035000
        moneda:
          type: string
          example: COP

    ConfirmarReservaRequest:
      type: object
      description: Todo el cuerpo es opcional.
      properties:
        horaEstimadaLlegada:
          type: string
          example: "15:30"
          description: Solo si la reserva se creó sin ella (RN-09). Entre las 22:00 y las 05:00 agrega el recargo de RN-Propia-02.
        medioPago:
          type: string
          enum: [TRANSFERENCIA, TARJETA, EFECTIVO]
          description: Medio con el que se paga el anticipo; obligatorio si el alojamiento exige anticipo.
        referencia:
          type: string
          maxLength: 60

    CancelarReservaRequest:
      type: object
      required:
        - motivo
      properties:
        motivo:
          type: string
          minLength: 5
          maxLength: 300
          example: El huésped cambió de planes

    OcupanteResponse:
      type: object
      properties:
        documento:
          type: string
        nombre:
          type: string
        fechaNacimiento:
          type: string
          format: date

    ReservaDetalleResponse:
      type: object
      description: Valores en pesos colombianos sin decimales.
      properties:
        codigo:
          type: string
          example: RES-2026-00001
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADA, EN_CURSO, FINALIZADA, CANCELADA, NO_SHOW]
        canalOrigen:
          type: string
          enum: [PORTAL, DIRECTO, EXTERNO]
        identificacionApartamento:
          type: string
          example: ATK-001
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        noches:
          type: integer
        horaEstimadaLlegada:
          type: string
          nullable: true
          example: "15:30"
        conMascota:
          type: boolean
        titular:
          $ref: '#/components/schemas/OcupanteResponse'
        ocupantes:
          type: array
          description: Todos los ocupantes, incluido el titular.
          items:
            $ref: '#/components/schemas/OcupanteResponse'
        totalOcupantes:
          type: integer
        valorTotal:
          type: integer
          format: int64
          description: Valor de la cotización congelada al crear la reserva (RN-22).
          example: 1035000
        totalCargosFolio:
          type: integer
          format: int64
          description: Suma de cargos del folio (hospedaje más cargos extra, como el recargo por llegada nocturna).
          example: 1065000
        moneda:
          type: string
          example: COP
        versionPoliticaCancelacion:
          type: string
          description: Versión de la política congelada en la reserva (RN-13, RN-22).
          example: v1
        fechaCreacion:
          type: string
          format: date
        motivoCancelacion:
          type: string
          nullable: true
        retenidoPorCancelacion:
          type: integer
          format: int64
          nullable: true
          description: Del anticipo pagado, lo que se retiene según la política congelada (RN-13). Solo si está cancelada.
        devueltoPorCancelacion:
          type: integer
          format: int64
          nullable: true
          description: Del anticipo pagado, lo que se devuelve. Solo si está cancelada.

    RegistrarPagoRequest:
      type: object
      required:
        - medioPago
        - valor
      properties:
        medioPago:
          type: string
          enum: [TRANSFERENCIA, TARJETA, EFECTIVO]
        valor:
          type: number
          description: Pesos colombianos. Mayor a cero y no superior al saldo pendiente.
          example: 100000
        referencia:
          type: string
          maxLength: 60

    CargoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [ALOJAMIENTO, SERVICIO_ADICIONAL, AJUSTE_POR_MODIFICACION, PENALIDAD]
        valor:
          type: integer
          format: int64

    PagoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        medio:
          type: string
          enum: [TRANSFERENCIA, TARJETA, EFECTIVO]
        fecha:
          type: string
          format: date
        valor:
          type: integer
          format: int64

    FolioResponse:
      type: object
      description: Valores en pesos colombianos sin decimales.
      properties:
        codigoReserva:
          type: string
          example: RES-2026-00001
        cargos:
          type: array
          items:
            $ref: '#/components/schemas/CargoResponse'
        pagos:
          type: array
          items:
            $ref: '#/components/schemas/PagoResponse'
        totalCargos:
          type: integer
          format: int64
        totalPagos:
          type: integer
          format: int64
        saldoPendiente:
          type: integer
          format: int64
          description: totalCargos menos totalPagos (RN-15); nunca es negativo.
        moneda:
          type: string
          example: COP

    ErrorResponse:
      type: object
      description: Único formato de error de la API. Nunca contiene trazas técnicas.
      required:
        - codigoError
        - mensaje
      properties:
        codigoError:
          type: string
          description: >-
            Código estable del tipo de error. VALIDACION, SOLICITUD_MALFORMADA, SOLICITUD_INCOMPLETA y
            SOLICITUD_INVALIDA acompañan a un 400; NO_AUTENTICADO, a un 401; ACCESO_DENEGADO, a un 403; NO_ENCONTRADO, a un 404; METODO_NO_PERMITIDO, a un 405;
            TIPO_NO_SOPORTADO, a un 415; REGLA_DOMINIO, a un 409; ERROR_INTERNO, a un 500 (sin detalles técnicos).
          enum: [VALIDACION, SOLICITUD_MALFORMADA, SOLICITUD_INCOMPLETA, SOLICITUD_INVALIDA, NO_AUTENTICADO, ACCESO_DENEGADO,
                 NO_ENCONTRADO, METODO_NO_PERMITIDO, TIPO_NO_SOPORTADO, REGLA_DOMINIO, ERROR_INTERNO]
          example: REGLA_DOMINIO
        mensaje:
          type: string
          example: "El número de ocupantes excede la capacidad del apartamento (RN-02)."
        detalles:
          type: array
          description: Una línea por campo inválido (solo en errores de validación). Vacía en los demás casos.
          items:
            type: string
          example: ["capacidad: La capacidad debe ser al menos 1"]

    LoginRequest:
      type: object
      required:
        - correo
        - contrasena
      properties:
        correo:
          type: string
          format: email
          example: admin@sga.local
        contrasena:
          type: string
          format: password
          example: Admin2026

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT firmado para enviar en el encabezado Authorization.
        tipo:
          type: string
          example: Bearer
        expiraEn:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
          example: [ ROLE_ADMINISTRADOR ]
