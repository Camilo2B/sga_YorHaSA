openapi: 3.1.0
info:
  title: SGA - Búnker Orbital YoRHa API
  description: >-
    API OpenAPI 3.1 para el Sistema de Gestión de Alojamiento (SGA) del Búnker Orbital YoRHa.
    Convención de errores: 400 = la forma del mensaje es inválida (la detectan las validaciones del DTO);
    404 = el recurso no existe; 409 = el mensaje es válido pero viola una regla de negocio (la detecta el dominio).
    Todos los errores usan el mismo formato ErrorResponse y nunca incluyen trazas técnicas.
  version: 1.0.0

paths:
  /api/reservas:
    post:
      summary: Crear una nueva reserva (CrearReservaUseCase)
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
      responses:
        '201':
          description: Reserva creada exitosamente en estado PENDIENTE.
          headers:
            Location:
              description: URI de la reserva creada.
              schema:
                type: string
                example: /api/reservas/RES-2026-00001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: La forma del mensaje es inválida (campos faltantes, JSON malformado o valores no permitidos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento indicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (capacidad superada, fechas inválidas, estancia solapada, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Consultar reservas filtradas por estado (ConsultarReservasPorEstadoUseCase)
      operationId: consultarReservas
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [PENDIENTE, CONFIRMADA, EN_CURSO, FINALIZADA, CANCELADA, NO_SHOW]
      responses:
        '200':
          description: Listado de reservas encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservaResponse'

  /api/reservas/{codigo}:
    get:
      summary: Consultar detalle de una reserva por su código
      operationId: obtenerReservaPorCodigo
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: RES-2026-00001
      responses:
        '200':
          description: Detalle de la reserva consultada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '404':
          description: Reserva no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/confirmar:
    put:
      summary: Confirmar una reserva pendiente con su anticipo (ConfirmarReservaUseCase)
      operationId: confirmarReserva
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reserva confirmada correctamente.
        '404':
          description: Reserva no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Transición de estado inválida o plazo de confirmación vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/cancelar:
    put:
      summary: Cancelar una reserva aplicando política de retención (CancelarReservaUseCase)
      operationId: cancelarReserva
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reserva cancelada exitosamente y disponibilidad liberada.
        '404':
          description: Reserva no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No se puede cancelar una reserva finalizada o en curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/registrar-llegada:
    put:
      summary: Registrar la llegada/check-in del grupo (RegistrarLlegadaUseCase)
      operationId: registrarLlegada
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Registro realizado. La reserva pasa a EN_CURSO y el apartamento a OCUPADO.
        '404':
          description: Reserva no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El apartamento no está en estado PREPARADO o no es la fecha de entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/registrar-salida:
    put:
      summary: Registrar la salida/check-out del grupo (RegistrarSalidaUseCase)
      operationId: registrarSalida
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Salida registrada. La reserva pasa a FINALIZADA.
        '404':
          description: Reserva no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El folio tiene saldo pendiente sin autorización del administrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/no-show:
    put:
      summary: Declarar no-show por ausencia del titular tras la hora límite (DeclararNoShowUseCase)
      operationId: declararNoShow
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reserva marcada como NO_SHOW y retención del 100% del anticipo aplicada.
        '404':
          description: Reserva no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Transición inválida para el estado actual de la reserva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos:
    post:
      summary: Registrar un apartamento (CrearApartamentoUseCase)
      operationId: crearApartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearApartamentoRequest'
      responses:
        '201':
          description: Apartamento registrado.
          headers:
            Location:
              description: URI del apartamento creado.
              schema:
                type: string
                example: /api/apartamentos/ATK-001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          description: La forma del mensaje es inválida (campos faltantes, capacidad menor a 1, estado operativo inexistente, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (identificación de apartamento repetida, L-04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}:
    get:
      summary: Consultar un apartamento por su identificación (ConsultarApartamentoUseCase)
      operationId: consultarApartamento
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
      responses:
        '200':
          description: Apartamento encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '404':
          description: No existe un apartamento con esa identificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alojamiento:
    get:
      summary: Consultar el alojamiento con sus parámetros, temporadas y política de cancelación vigente (ConsultarAlojamientoUseCase)
      operationId: consultarAlojamiento
      responses:
        '200':
          description: Datos del alojamiento. Los parámetros salen de la configuración del sistema (application.properties).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientoResponse'
        '404':
          description: El alojamiento todavía no ha sido configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alojamiento/temporadas:
    post:
      summary: Registrar una temporada (RegistrarTemporadaUseCase)
      operationId: registrarTemporada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarTemporadaRequest'
      responses:
        '201':
          description: Temporada registrada.
          headers:
            Location:
              description: URI de la temporada creada.
              schema:
                type: string
                example: /api/alojamiento/temporadas/3f2b8c1e-5a47-4d9e-9c1a-7b6d2e8f0a11
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
        '400':
          description: La forma del mensaje es inválida (nombre vacío, fechas faltantes o con formato incorrecto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El alojamiento todavía no ha sido configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (la fecha de fin no es posterior a la de inicio, o la temporada se solapa con otra existente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alojamiento/temporadas/{id}:
    get:
      summary: Consultar una temporada por su identificador (ConsultarTemporadaUseCase)
      operationId: consultarTemporada
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Temporada encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
        '400':
          description: El identificador no tiene formato UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe una temporada con ese identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{id}/bloquear:
    post:
      summary: Bloquear un apartamento para mantenimiento o uso administrativo (BloquearApartamentoUseCase)
      operationId: bloquearApartamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloquearApartamentoRequest'
      responses:
        '201':
          description: Bloqueo registrado exitosamente.
        '400':
          description: La forma del mensaje es inválida (fechas faltantes o motivo vacío).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento indicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto con reservas activas en el rango seleccionado (RN-07) o con otro bloqueo existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{identificacion}/tarifas:
    post:
      summary: Definir la tarifa de un apartamento para una temporada (DefinirTarifaUseCase)
      description: >-
        Agrega una nueva versión de la tarifa; las anteriores se conservan como histórico (7.4).
        La tarifa nueva debe regir después de la más reciente de esa misma temporada.
      operationId: definirTarifa
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinirTarifaRequest'
      responses:
        '201':
          description: Tarifa definida.
          headers:
            Location:
              description: URI del histórico de tarifas del apartamento.
              schema:
                type: string
                example: /api/apartamentos/ATK-001/tarifas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarifaResponse'
        '400':
          description: La forma del mensaje es inválida (temporada, valor o fecha faltantes, valor menor o igual a cero, identificador que no es UUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento o la temporada indicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (la tarifa no rige después de la más reciente de esa temporada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Consultar el histórico de tarifas de un apartamento (ListarTarifasApartamentoUseCase)
      description: Devuelve las tarifas de la más reciente a la más antigua. Con temporadaId se limita a esa temporada.
      operationId: listarTarifasApartamento
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: ATK-001
        - name: temporadaId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Histórico de tarifas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TarifaResponse'
        '400':
          description: El temporadaId no tiene formato UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alojamiento/politica-cancelacion:
    post:
      summary: Definir una nueva versión de la política de cancelación (DefinirPoliticaCancelacionUseCase)
      description: >-
        Agrega una versión nueva; las anteriores se conservan (F-07, RN-13). Mínimo dos tramos, uno de ellos de 0 horas,
        sin repetir la antelación mínima, y debe regir después de la versión más reciente.
      operationId: definirPoliticaCancelacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinirPoliticaCancelacionRequest'
      responses:
        '201':
          description: Política definida.
          headers:
            Location:
              description: URI de la versión creada.
              schema:
                type: string
                example: /api/alojamiento/politica-cancelacion/2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
        '400':
          description: La forma del mensaje es inválida (sin tramos, retención fuera de 0 a 1, antelación negativa, fecha faltante).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El alojamiento todavía no ha sido configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (menos de dos tramos, sin tramo de 0 horas, antelaciones repetidas o vigencia no posterior a la versión más reciente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Consultar todas las versiones de la política de cancelación (ListarPoliticasCancelacionUseCase)
      description: De la primera versión a la más reciente.
      operationId: listarPoliticasCancelacion
      responses:
        '200':
          description: Historial de versiones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoliticaCancelacionResponse'
        '404':
          description: El alojamiento todavía no ha sido configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alojamiento/politica-cancelacion/{version}:
    get:
      summary: Consultar una versión de la política de cancelación (ConsultarPoliticaCancelacionUseCase)
      operationId: consultarPoliticaCancelacion
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Versión encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
        '400':
          description: La versión no es un número entero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe esa versión de la política.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cotizaciones:
    post:
      summary: Cotizar una estancia (CotizarEstanciaUseCase)
      description: >-
        Calcula el valor de una estancia noche por noche (RN-05) con la tarifa de la temporada de cada noche, solo los
        ocupantes facturables a la fecha de entrada (RN-06) y el descuento por estancia prolongada (RN-Propia-01).
        No crea nada: es una consulta, por eso responde 200.
      operationId: cotizarEstancia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizarEstanciaRequest'
      responses:
        '200':
          description: Cotización con su desglose por noche.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResponse'
        '400':
          description: La forma del mensaje es inválida (apartamento, fechas u ocupantes faltantes, fecha de nacimiento futura).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el apartamento indicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Regla de negocio violada (salida no posterior a la entrada, ningún ocupante facturable, o el apartamento no tiene tarifa para la temporada de alguna noche).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CrearReservaRequest:
      type: object
      required:
        - apartamentoId
        - fechaEntrada
        - fechaSalida
        - titularId
        - cantidadOcupantes
        - tieneMascota
      properties:
        apartamentoId:
          type: string
          example: ATK-001
        fechaEntrada:
          type: string
          format: date
          example: "2026-10-15"
        fechaSalida:
          type: string
          format: date
          example: "2026-10-20"
        titularId:
          type: string
          example: "1094123456"
        cantidadOcupantes:
          type: integer
          example: 3
        tieneMascota:
          type: boolean
          example: false

    BloquearApartamentoRequest:
      type: object
      required:
        - fechaInicio
        - fechaFin
        - motivo
      properties:
        fechaInicio:
          type: string
          format: date
          example: "2026-11-01"
        fechaFin:
          type: string
          format: date
          example: "2026-11-05"
        motivo:
          type: string
          example: "Mantenimiento preventivo de sistemas orbitales"

    ReservaResponse:
      type: object
      properties:
        codigo:
          type: string
          example: RES-2026-00001
        apartamentoId:
          type: string
          example: ATK-001
        estado:
          type: string
          example: PENDIENTE
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        valorTotal:
          type: number
          example: 500000

    CrearApartamentoRequest:
      type: object
      required:
        - identificacion
        - nombre
        - capacidad
        - dormitorios
        - estadoOperativoInicial
      properties:
        identificacion:
          type: string
          example: ATK-001
        nombre:
          type: string
          example: Attack Suite
        capacidad:
          type: integer
          minimum: 1
          example: 4
        dormitorios:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DormitorioRequest'
        estadoOperativoInicial:
          type: string
          enum: [PREPARADO, OCUPADO, PENDIENTE_PREPARACION, EN_PREPARACION, FUERA_DE_SERVICIO]

    DormitorioRequest:
      type: object
      required:
        - descripcion
        - tipoCama
      properties:
        descripcion:
          type: string
          example: Dormitorio 1
        tipoCama:
          type: string
          example: Cama doble

    ApartamentoResponse:
      type: object
      properties:
        identificacion:
          type: string
          example: ATK-001
        nombre:
          type: string
          example: Attack Suite
        capacidad:
          type: integer
          example: 4
        dormitorios:
          type: array
          items:
            $ref: '#/components/schemas/DormitorioResponse'
        estadoOperativo:
          type: string
          enum: [PREPARADO, OCUPADO, PENDIENTE_PREPARACION, EN_PREPARACION, FUERA_DE_SERVICIO]
        activo:
          type: boolean
          example: true

    DormitorioResponse:
      type: object
      properties:
        descripcion:
          type: string
          example: Dormitorio 1
        tipoCama:
          type: string
          example: Cama doble

    RegistrarTemporadaRequest:
      type: object
      required:
        - nombre
        - fechaInicio
        - fechaFin
      properties:
        nombre:
          type: string
          example: Alta (mitad de año)
        fechaInicio:
          type: string
          format: date
          example: "2027-06-01"
        fechaFin:
          type: string
          format: date
          description: Exclusiva, igual que en las estancias [inicio, fin).
          example: "2027-08-01"

    TemporadaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Despliegue de Misión
        fechaInicio:
          type: [string, 'null']
          format: date
          description: Nula en la temporada base, que cubre toda fecha no cubierta por otra temporada.
        fechaFin:
          type: [string, 'null']
          format: date
        esBase:
          type: boolean
          example: false

    ParametrosResponse:
      type: object
      description: Parámetros de la Ficha (sección 6). Salen de application.properties, no de la base de datos.
      properties:
        umbralEdadFacturable:
          type: integer
          example: 12
        horaEntrada:
          type: string
          format: time
          example: "15:00:00"
        horaSalida:
          type: string
          format: time
          example: "11:00:00"
        tiempoPreparacionHoras:
          type: integer
          example: 3
        plazoConfirmacionHoras:
          type: integer
          example: 24
        horaLimiteNoShow:
          type: string
          format: time
          example: "21:00:00"
        exigeAnticipo:
          type: boolean
          example: true
        porcentajeAnticipo:
          type: number
          description: Fracción del valor de la estancia (0.50 = 50%).
          example: 0.50

    TramoResponse:
      type: object
      properties:
        antelacionMinimaHoras:
          type: integer
          example: 168
        porcentajeRetencion:
          type: number
          example: 0.00
        porcentajeDevolucion:
          type: number
          description: Siempre es el complemento de la retención.
          example: 1.00

    PoliticaCancelacionResponse:
      type: object
      properties:
        version:
          type: integer
          example: 1
        vigenteDesde:
          type: string
          format: date
        tramos:
          type: array
          items:
            $ref: '#/components/schemas/TramoResponse'

    AlojamientoResponse:
      type: object
      properties:
        nombre:
          type: string
          example: Búnker Orbital YoRHa - Suites & Apartamentos Temáticos
        ciudad:
          type: string
          example: El Espacio
        parametros:
          $ref: '#/components/schemas/ParametrosResponse'
        temporadas:
          type: array
          items:
            $ref: '#/components/schemas/TemporadaResponse'
        politicaVigente:
          $ref: '#/components/schemas/PoliticaCancelacionResponse'

    DefinirTarifaRequest:
      type: object
      required:
        - temporadaId
        - valorPorNoche
        - vigenteDesde
      properties:
        temporadaId:
          type: string
          format: uuid
        valorPorNoche:
          type: number
          description: Valor por ocupante facturable y por noche, en COP. Mayor a cero.
          example: 90000
        vigenteDesde:
          type: string
          format: date
          example: "2027-01-01"

    TarifaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        temporadaId:
          type: string
          format: uuid
        valorPorNoche:
          type: number
          example: 80000
        vigenteDesde:
          type: string
          format: date

    TramoRequest:
      type: object
      required:
        - antelacionMinimaHoras
        - porcentajeRetencion
      properties:
        antelacionMinimaHoras:
          type: integer
          minimum: 0
          example: 168
        porcentajeRetencion:
          type: number
          minimum: 0
          maximum: 1
          description: Fracción del anticipo que se retiene (0.50 = 50%). La devolución es el complemento.
          example: 0.00

    DefinirPoliticaCancelacionRequest:
      type: object
      required:
        - tramos
        - vigenteDesde
      properties:
        tramos:
          type: array
          items:
            $ref: '#/components/schemas/TramoRequest'
        vigenteDesde:
          type: string
          format: date
          example: "2027-01-01"

    OcupanteRequest:
      type: object
      required:
        - documento
        - nombre
        - fechaNacimiento
      properties:
        documento:
          type: string
          minLength: 7
          maxLength: 11
          example: "1094123456"
        nombre:
          type: string
          example: Camilo Ruiz
        fechaNacimiento:
          type: string
          format: date
          description: La edad se calcula a la fecha de entrada; nunca se envía.
          example: "1990-05-01"

    CotizarEstanciaRequest:
      type: object
      required:
        - identificacionApartamento
        - fechaEntrada
        - fechaSalida
        - ocupantes
      properties:
        identificacionApartamento:
          type: string
          example: ATK-001
        fechaEntrada:
          type: string
          format: date
          example: "2026-12-13"
        fechaSalida:
          type: string
          format: date
          description: Exclusiva; la noche de la salida no se cobra.
          example: "2026-12-18"
        ocupantes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OcupanteRequest'

    DetalleNocheResponse:
      type: object
      description: Valores en pesos colombianos sin decimales.
      properties:
        fecha:
          type: string
          format: date
        temporada:
          type: string
          example: Media (Sincronización)
        tarifaAplicada:
          type: integer
          format: int64
          description: Tarifa de la noche por ocupante facturable, ya con el descuento si aplica.
          example: 90000
        ocupantesFacturables:
          type: integer
          example: 2
        subtotal:
          type: integer
          format: int64
          example: 180000

    CotizacionResponse:
      type: object
      properties:
        identificacionApartamento:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        noches:
          type: integer
        ocupantesFacturables:
          type: integer
        desglose:
          type: array
          items:
            $ref: '#/components/schemas/DetalleNocheResponse'
        valorTotal:
          type: integer
          format: int64
          example: 1035000
        moneda:
          type: string
          example: COP

    ErrorResponse:
      type: object
      description: Único formato de error de la API. Nunca contiene trazas técnicas.
      required:
        - codigoError
        - mensaje
      properties:
        codigoError:
          type: string
          description: >-
            Código estable del tipo de error. VALIDACION y SOLICITUD_MALFORMADA acompañan a un 400;
            NO_ENCONTRADO, a un 404; REGLA_DOMINIO, a un 409.
          enum: [VALIDACION, SOLICITUD_MALFORMADA, NO_ENCONTRADO, REGLA_DOMINIO]
          example: REGLA_DOMINIO
        mensaje:
          type: string
          example: "El número de ocupantes excede la capacidad del apartamento (RN-02)."
        detalles:
          type: array
          description: Una línea por campo inválido (solo en errores de validación). Vacía en los demás casos.
          items:
            type: string
          example: ["capacidad: La capacidad debe ser al menos 1"]
