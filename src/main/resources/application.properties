spring.application.name=sga

# --- Base de datos H2 en memoria ---

spring.datasource.url=jdbc:h2:mem:sgadb

spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=

# --- Consola web de H2 ---

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console

# --- JPA ---

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Las transacciones las manejan los casos de uso y los adaptadores, no la capa web

spring.jpa.open-in-view=false

# --- Servidor ---

server.port=8080

# --- Swagger UI ---
# Muestra el contrato docs/api/openapi.yaml en vez del que springdoc deduce del código
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html