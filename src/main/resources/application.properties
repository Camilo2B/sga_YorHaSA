# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
spring.application.name=sga

# CONFIGURACIÓN DEL SERVIDOR
server.port=8080

# BASE DE DATOS H2 (EN MEMORIA)
spring.datasource.url=jdbc:h2:mem:sgadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Las transacciones las manejan los casos de uso y los adaptadores, no la capa web
spring.jpa.open-in-view=false

# Carga de scripts SQL iniciales si existen (schema.sql / data.sql)
spring.sql.init.mode=always

# PAGINACIÓN Y SERIALIZACIÓN
# Listados: 10 por página y JSON estable de Page (content + page{size, number, totalElements, totalPages})
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.serialization-mode=via-dto

# DOCUMENTACIÓN CON OPENAPI / SWAGGER UI
# Muestra el contrato docs/api/openapi.yaml en vez del que springdoc deduce del código
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# TRAZABILIDAD Y LOGGING
logging.level.root=INFO
logging.level.co.edu.uniquindio.sga=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# PARÁMETROS DE LA FICHA (A.4) Y REGLAS DE NEGOCIO
sga.alojamiento.umbral-edad-facturable=12
sga.alojamiento.hora-entrada=15:00
sga.alojamiento.hora-salida=11:00
sga.alojamiento.tiempo-preparacion-horas=3
sga.alojamiento.plazo-confirmacion-horas=24
sga.alojamiento.hora-limite-no-show=21:00
sga.alojamiento.exige-anticipo=true
# Fracción entre 0 y 1 (0.50 = 50%)
sga.alojamiento.porcentaje-anticipo=0.50

# RN-Propia-01: descuento por estancia prolongada
sga.alojamiento.noches-descuento-estancia-prolongada=5
# Fracción entre 0 y 1 (0.10 = 10%)
sga.alojamiento.porcentaje-descuento-estancia-prolongada=0.10

# RN-Propia-02: recargo por llegada nocturna (franja que cruza la medianoche, ambos extremos incluidos)
sga.alojamiento.recargo-llegada-nocturna=30000
sga.alojamiento.hora-inicio-llegada-nocturna=22:00
sga.alojamiento.hora-fin-llegada-nocturna=05:00

# RN-21: cada cuántos milisegundos se buscan las reservas PENDIENTE con el plazo de confirmación vencido
sga.reservas.verificacion-vencimiento-ms=60000

# RN-12: cada cuántos milisegundos se buscan las reservas CONFIRMADA cuyo titular no llegó antes de la hora límite
sga.reservas.verificacion-no-show-ms=60000

spring.config.import=optional:file:src/main/resources/application-secrets.properties

# --- Configuración de JWT ---
sga.jwt.emisor=sga-backend
sga.jwt.expiracion-minutos=60

