spring.application.name=sga

# --- Base de datos H2 en memoria ---

spring.datasource.url=jdbc:h2:mem:sgadb

spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=

# --- Consola web de H2 ---

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console

# --- JPA ---

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Las transacciones las manejan los casos de uso y los adaptadores, no la capa web

spring.jpa.open-in-view=false

# --- Servidor ---

server.port=8080

# --- Swagger UI ---
# Muestra el contrato docs/api/openapi.yaml en vez del que springdoc deduce del código
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# --- Parámetros de la Ficha (A.4): cambiarlos no requiere recompilar ---
sga.alojamiento.umbral-edad-facturable=12
sga.alojamiento.hora-entrada=15:00
sga.alojamiento.hora-salida=11:00
sga.alojamiento.tiempo-preparacion-horas=3
sga.alojamiento.plazo-confirmacion-horas=24
sga.alojamiento.hora-limite-no-show=21:00
sga.alojamiento.exige-anticipo=true
# Fracción entre 0 y 1 (0.50 = 50%)
sga.alojamiento.porcentaje-anticipo=0.50
# --- RN-Propia-01: descuento por estancia prolongada ---
sga.alojamiento.noches-descuento-estancia-prolongada=5
# Fracción entre 0 y 1 (0.10 = 10%)
sga.alojamiento.porcentaje-descuento-estancia-prolongada=0.10
