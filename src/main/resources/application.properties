spring.application.name=sga

# --- Base de datos H2 en memoria ---

spring.datasource.url=jdbc:h2:mem:sgadb

spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=

# --- Consola web de H2 ---

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console

# --- JPA ---

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Las transacciones las manejan los casos de uso y los adaptadores, no la capa web

spring.jpa.open-in-view=false

# --- Servidor ---

server.port=8080

# --- Parametros de la Ficha del Alojamiento (sección 6 / A.4) ---
# Las horas van en formato HH:mm; el porcentaje de anticipo es una fracción (0.50 = 50%).

sga.alojamiento.umbral-edad-facturable=12

sga.alojamiento.hora-entrada=15:00

sga.alojamiento.hora-salida=11:00

sga.alojamiento.tiempo-preparacion-horas=3

sga.alojamiento.plazo-confirmacion-horas=24

sga.alojamiento.hora-limite-no-show=21:00

sga.alojamiento.exige-anticipo=true

sga.alojamiento.porcentaje-anticipo=0.50
